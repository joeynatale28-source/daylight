name: Verify Daylight iCal and MCP
on:
  push:
    branches:
      - feature/ical-mcp-integration-20261104
      - feature/google-places-autocomplete-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cloud and integration JavaScript
        run: |
          node --check daylight-cloud.js
          node --check daylight-integrations.js
          node --check daylight-places.js
          node --check daylight-settings.js
      - name: Syntax check embedded application script
        run: |
          node --input-type=module - <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)]
            .map(match=>match[1]).filter(Boolean);
          if(!scripts.length)throw Error('No embedded script found');
          for(const script of scripts)new vm.Script(script,{filename:'index.html'});
          console.log('Checked',scripts.length,'inline scripts');
          EOF
      - name: Install browser DOM test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Verify Photon address UI behaviors
        run: node --test tests/daylight-places.test.mjs
      - name: Verify unauthenticated Photon proxy returns 401
        run: |
          status=$(curl --silent --show-error --max-time 15 -o /tmp/places_response.txt -w '%{http_code}' \
            -X POST https://qrqemjgpzoqhtmsowmqv.supabase.co/functions/v1/places \
            -H 'Content-Type: application/json' \
            -d '{"action":"autocomplete","input":"10833 W Broad"}')
          test "$status" = 401 || { echo "Expected 401, received $status"; cat /tmp/places_response.txt; exit 1; }
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm install --no-audit --no-fund
      - name: Typecheck MCP server and smoke test
        working-directory: mcp
        run: npm run typecheck
