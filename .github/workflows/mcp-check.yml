name: Verify Daylight MCP package

on:
  push:
    branches:
      - feat/ical-mcp-integration
    paths:
      - mcp/**
      - .github/workflows/mcp-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck server and smoke tests
        run: npm run check
