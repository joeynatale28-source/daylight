name: Verify Daylight OAuth MCP
on:
  push:
    branches: [main]
    paths:
      - daylight-oauth.js
      - supabase/functions/mcp/index.ts
      - .github/workflows/verify-oauth.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new JavaScript
        run: |
          node --check daylight-enhancements.js
          node --check daylight-oauth.js
          node --check daylight-integrations.js
          node --check daylight-settings.js
      - name: Check OAuth resource metadata and missing-token response
        run: |
          set -euo pipefail
          base=https://qrqemjgpzoqhtmsowmqv.supabase.co/functions/v1/mcp
          code=$(curl -sS --max-time 20 -o /tmp/resource.json -w '%{http_code}' "$base/oauth-protected-resource")
          echo "Protected resource metadata HTTP $code"
          cat /tmp/resource.json
          test "$code" = 200
          grep -q 'authorization_servers' /tmp/resource.json
          code=$(curl -sS --max-time 20 -D /tmp/headers -o /tmp/unauth.json -w '%{http_code}' \
            -X POST "$base" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "Unauthenticated MCP HTTP $code"
          cat /tmp/headers
          test "$code" = 401
          grep -iq 'www-authenticate' /tmp/headers
      - name: Report authorization-server discovery (dashboard prerequisite)
        continue-on-error: true
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/issuer.json -w '%{http_code}' \
            https://qrqemjgpzoqhtmsowmqv.supabase.co/.well-known/oauth-authorization-server/auth/v1)
          echo "OAuth authorization-server discovery HTTP $code"
          test "$code" = 200
          grep -q 'authorization_endpoint' /tmp/issuer.json
