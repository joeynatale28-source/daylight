name: Daylight browser visual regression
on:
  push:
    branches: [main]
    paths:
      - index.html
      - daylight-cloud.js
      - daylight-notifications.js
      - daylight-admin.js
      - daylight-sharing.js
      - daylight-manage.js
      - daylight-onboarding.js
      - daylight-integrations.js
      - daylight-oauth.js
      - daylight-settings.js
      - daylight-enhancements.js
      - tests/daylight-ui-smoke.mjs
      - .github/workflows/verify-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium if necessary
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y chromium
          fi
      - name: Install Puppeteer Core
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.26.1
      - name: Capture and verify both themes
        run: node tests/daylight-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daylight-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore
