name: Deploy Daylight to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - daylight-cloud.js
      - daylight-settings.js
      - daylight-integrations.js
      - daylight-places.js
      - daylight-places.css
      - daylight-enhancements.js
      - daylight-oauth.js
      - 404.html
      - assets/banners/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Daylight
        uses: actions/checkout@v4

      - name: Prepare public site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html daylight-cloud.js daylight-settings.js daylight-integrations.js daylight-places.js daylight-places.css daylight-enhancements.js daylight-oauth.js 404.html _site/
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          test -s _site/index.html
          test -s _site/daylight-cloud.js
          test -s _site/daylight-settings.js
          test -s _site/daylight-integrations.js
          test -s _site/daylight-places.js
          test -s _site/daylight-oauth.js
          test -s _site/404.html
          test -s _site/daylight-enhancements.js
          test -s _site/daylight-places.css
          test "$(find _site/assets/banners/sports -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 42
          test "$(find _site/assets/banners/holidays -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 22
          test "$(find _site/assets/banners/school-life -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 28
          test "$(find _site/assets/banners -type f -name '*.webp' | wc -l)" -eq 92

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
