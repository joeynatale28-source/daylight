name: Deploy Daylight to GitHub Pages
# One site: landing (/), /login, /sign-up, /dashboard, shared assets. (retrigger: Pages artifact lookup race)

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 404.html
      - site/**
      - dashboard/**
      - login/**
      - sign-up/**
      - privacy/**
      - tos/**
      - assets/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Daylight
        uses: actions/checkout@v4
      - name: Prepare public site
        run: |
          set -euo pipefail
          mkdir -p _site
          # one site: landing page (/), sign-in (/login), create account (/sign-up), the app (/dashboard), shared assets
          cp index.html 404.html _site/
          cp -R site dashboard login sign-up privacy tos assets _site/
          # Version-bust every deploy: caches and first-paint snapshots written by a
          # different build are ignored (see window.__DL_BUILD in dashboard/boot.js).
          grep -rl "__BUILD_ID__" _site --include='*.html' | xargs sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g"
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" _site/dashboard/boot.js
          grep -q "${GITHUB_SHA}" _site/dashboard/index.html
          for f in index.html 404.html             site/landing.css site/landing.js             login/index.html sign-up/index.html privacy/index.html tos/index.html dashboard/index.html             dashboard/boot.js dashboard/shell.js dashboard/app.js dashboard/app.css dashboard/route.js             dashboard/daylight-cloud.js dashboard/daylight-notifications.js dashboard/daylight-admin.js dashboard/daylight-adminpage.js             dashboard/daylight-auth.js dashboard/daylight-security.js dashboard/daylight-ai-access.js dashboard/daylight-print.js             dashboard/daylight-event-tools.js dashboard/daylight-sharing.js dashboard/daylight-manage.js dashboard/daylight-onboarding.js             dashboard/daylight-settings.js dashboard/daylight-integrations.js dashboard/daylight-places.js dashboard/daylight-places.css             dashboard/daylight-enhancements.js dashboard/daylight-oauth.js dashboard/daylight-banners.js; do
            test -s "_site/$f" || { echo "missing $f"; exit 1; }
          done
          test -d _site/assets/banners
          banner_count="$(find _site/assets/banners -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$banner_count" = "91"
      - name: Verify deployed Supabase edge functions
        run: |
          set -euo pipefail
          base="https://usihrcucnreecynewgbd.supabase.co/functions/v1"
          origin="https://joeynatale28-source.github.io"
          for fn in ical-feed places; do
            preflight="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$base/$fn" \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type,x-client-info')"
            test "$preflight" = "204"
            unauth="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/$fn" \
              -H "Origin: $origin" -H 'Content-Type: application/json' --data '{"action":"status"}')"
            test "$unauth" = "401"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published logo and favicon URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for asset in \
            assets/daylight-sunarc-light-NOBG.png \
            assets/daylight-sunarc-dark-NOBG.png \
            assets/favicon-light-16.png \
            assets/favicon-light-32.png \
            assets/favicon-dark-16.png \
            assets/favicon-dark-32.png \
            assets/apple-touch-icon.png; do
            status="$(curl --retry 8 --retry-all-errors --retry-delay 3 -sS -o /dev/null -w '%{http_code}' "${base}/${asset}")"
            printf '%s %s\n' "${asset}" "${status}"
            test "${status}" = "200"
          done
