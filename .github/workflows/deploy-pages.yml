name: Deploy Daylight to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - daylight-cloud.js
      - daylight-settings.js
      - daylight-integrations.js
      - daylight-places.js
      - daylight-places.css
      - daylight-enhancements.js
      - daylight-oauth.js
      - daylight-banners.js
      - assets/**
      - 404.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Daylight
        uses: actions/checkout@v4
      - name: Prepare public site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html daylight-cloud.js daylight-settings.js daylight-integrations.js daylight-places.js daylight-places.css daylight-enhancements.js daylight-oauth.js daylight-banners.js 404.html _site/
          cp -R assets/. _site/assets/
          test -s _site/index.html
          test -s _site/daylight-cloud.js
          test -s _site/daylight-settings.js
          test -s _site/daylight-integrations.js
          test -s _site/daylight-places.js
          test -s _site/daylight-places.css
          test -s _site/daylight-enhancements.js
          test -s _site/daylight-oauth.js
          test -s _site/daylight-banners.js
          test -s _site/404.html
          test -d _site/assets/banners
          banner_count="$(find _site/assets/banners -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$banner_count" = "91"
      - name: Verify deployed Supabase edge functions
        run: |
          set -euo pipefail
          base="https://qrqemjgpzoqhtmsowmqv.supabase.co/functions/v1"
          origin="https://joeynatale28-source.github.io"
          for fn in ical-feed places; do
            preflight="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$base/$fn" \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type,x-client-info')"
            test "$preflight" = "204"
            unauth="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/$fn" \
              -H "Origin: $origin" -H 'Content-Type: application/json' --data '{"action":"status"}')"
            test "$unauth" = "401"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
