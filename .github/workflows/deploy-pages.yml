name: Deploy Daylight to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - daylight-cloud.js
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Daylight
        uses: actions/checkout@v4

      - name: Prepare public site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html daylight-cloud.js _site/
          test -s _site/index.html
          test -s _site/daylight-cloud.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
