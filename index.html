         rotates open; the menu scales from the trigger at 0.95 on the
         shared popIn curve, selected row carries a check, long lists
         get a filter field. */
      .dd {
        width: 100%; max-width: 300px; display: inline-flex; align-items: center; gap: 10px;
        height: 44px; padding: 0 14px 0 19px; border-radius: 999px; background: var(--input-bg);
        border: 1px solid transparent; font-size: 14px; color: var(--text); text-align: left;
        cursor: pointer; transition: background 120ms, border-color 120ms, box-shadow 120ms;
      }
      .dd:hover { background: var(--hover); }
      .dd.open { background: var(--hover); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
      .dd:disabled { opacity: var(--dl-disabled-opacity, 0.55); cursor: default; }
      .dd:disabled:hover { background: var(--input-bg); }
      .dd .dd-val { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dd .dd-chev { flex: none; display: inline-flex; color: var(--muted); }
      .dd .dd-chev svg { transition: transform 160ms var(--ease-out); }
      .dd.open .dd-chev svg { transform: rotate(180deg); }
      .dd.sm { max-width: 232px; }
      .dd.xs { max-width: 158px; }
      .dd-menu { padding: 6px; outline: none; border-radius: 10px; }
      .dd-list { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
      .dd-list::-webkit-scrollbar { width: 8px; }
      .dd-list::-webkit-scrollbar-thumb { background: var(--selected); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
      /* Dropdown rows run ~32px (Linear/Plain density), radius 6 inside
         the menu's 10, hover = a light fill on that row only. */
      .dd-menu .menu-item { min-height: 32px; padding: 0 9px; gap: 8px; border-radius: 6px; font-size: 13.5px; }
      .dd-menu .menu-item.active { background: var(--hover); }
      .dd-menu .menu-item .dd-label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* The selection slot is always rendered (empty when unselected)
         so labels align; a selected row shows the check at the LEFT. */
      .dd-menu .menu-item .mi-slot { width: 15px; flex: none; display: inline-flex; align-items: center; color: var(--text); margin-left: -1px; }
      .dd-menu .menu-item .dd-right { margin-left: auto; color: var(--muted); font-size: 12.5px; flex: none; font-variant-numeric: tabular-nums; }
      /* Sticky region labels inside long grouped lists (time zones). */
      .dd-group {
        position: sticky; top: 0; z-index: 1; background: var(--menu-bg);
        font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
        color: var(--muted); padding: 8px 9px 4px;
      }
      .dd-group:first-child { padding-top: 4px; }
      .dd-search { display: flex; align-items: center; gap: 9px; padding: 7px 11px 9px; border-bottom: 1px solid var(--line-soft); margin-bottom: 6px; color: var(--muted); }
      .dd-search input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 14px; color: var(--text); }
      .dd-search input::placeholder { color: var(--faint); }
      .dd-empty { padding: 14px 11px; font-size: 13.5px; color: var(--muted); text-align: center; }
      .set-row { padding: 17px 0; border-bottom: 1px solid var(--line-soft); align-items: flex-start; }
      .set-row > span:first-child { flex: 1 1 auto; min-width: 0; padding-right: 18px; padding-top: 1px; }
      .set-row .dd, .set-row .switch { margin-top: 1px; flex: none; }
      .set-row:last-child { border-bottom: none; padding-bottom: 10px; }
      .set-group .field:last-child { margin-bottom: 8px; }
      .feed-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 8px; }
      .feed-row .fr-url { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .feed-row .fr-sub { font-size: 12px; color: var(--muted); }
      .about-logo { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
      .about-logo .logo-tile { width: 46px; height: 46px; border-radius: var(--r-lg); }
      .about-logo .daylight-mark { width: 46px; height: 46px; }
      .inline-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.55; max-width: 460px; }
      .set-helper { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin: 10px 0 6px; max-width: 480px; }

      /* ---------- Search palette ---------- */
      /* Command palette: a 100×/day surface — fade only, no scale/slide. */
      .palette-backdrop { position: fixed; inset: 0; z-index: 450; background: var(--backdrop); display: flex; justify-content: center; align-items: flex-start; padding: 12dvh 16px 16px; animation: fadeIn 120ms var(--ease-out); }
      .palette { width: 600px; max-width: 94vw; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-pop); overflow: hidden; animation: fadeIn 120ms var(--ease-out); display: flex; flex-direction: column; max-height: 70dvh; }
      .palette-input-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
      .palette-input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 15.5px; color: var(--text); }
      .palette-input::placeholder { color: var(--faint); }
      .palette-clear { width: 26px; height: 26px; border-radius: 50%; background: var(--selected); color: var(--muted); display: none; align-items: center; justify-content: center; flex: none; }
      .palette-clear.show { display: inline-flex; }
      .palette-clear:hover { color: var(--text); background: var(--hover); }
      .palette-close { width: 36px; height: 36px; border-radius: var(--r-md); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
      .palette-clear { width: 28px; height: 28px; }
      .palette-close:hover { background: var(--hover); color: var(--text); }
      .input-clear-wrap { position: relative; }
      .input-clear-wrap .text-input { padding-right: 34px; }
      .input-clear {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        width: 24px; height: 24px; border-radius: 50%; background: var(--selected); color: var(--muted);
        display: none; align-items: center; justify-content: center;
      }
      .input-clear.show { display: inline-flex; }
      .input-clear:hover { color: var(--text); background: var(--hover); }
      .palette-results { overflow-y: auto; padding: 8px 8px 12px; min-height: 0; flex: 1 1 auto; }
      .pal-group { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 5px; }
      .pal-item { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 8px 10px; border-radius: var(--r-md); text-align: left; transition: background 120ms var(--ease-out); }
      .pal-item:hover, .pal-item.active { background: var(--hover); }
      .pal-item .pi-title { font-size: 14px; font-weight: 500; }
      .pal-item .pi-sub { font-size: 12.5px; color: var(--muted); }
      .pal-item .pi-text { flex: 1; min-width: 0; }
      .pal-item .pi-title, .pal-item .pi-sub { white-space: normal; overflow-wrap: break-word; word-break: normal; }
      .pal-item .pi-title { line-height: 1.4; }
      .pal-item .pi-sub { line-height: 1.45; }

      /* ---------- Toasts ---------- */
      #toastRoot { position: fixed; right: 18px; bottom: 18px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
      .toast {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
        padding: 11px 14px; font-size: 14px; display: flex; align-items: center; gap: 12px;
        box-shadow: var(--shadow-pop); animation: toastIn 200ms var(--ease-out); max-width: min(360px, 90vw);
      }
      @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .toast.out { opacity: 0; transform: translateY(6px); transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
      .toast .t-action { color: var(--accent); font-weight: 600; font-size: 13.5px; }
      .toast .t-close { color: var(--muted); display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: var(--r-sm); flex: none; opacity: 0.75; }
      .toast .t-close:hover { color: var(--text); background: var(--hover); opacity: 1; }

      /* ---------- Sidebar tone (dark: Linear near-black) ----------
         Everything that sits ON the sidebar steps through the
         sidebar's own ramp (--sidebar-hover #191A1B, --sidebar-selected
         #232326 in dark) instead of the app-wide hover/selected greys,
         so no element on the panel uses the old flat sidebar steps.
         In light mode those tokens alias the standard light steps,
         so light is unchanged. Floating surfaces (menus, popovers,
         dialogs, the date picker) are NOT in #sidebar and keep their
         lifted #232323 / #282828 tones. */
      #sidebar .icon-btn:hover, #sidebar .mini-nav:hover, #sidebar .mini-day:hover,
      #sidebar .side-label-btn:hover, #sidebar .cal-row:hover, #sidebar .side-row:hover,
      #sidebar .profile-row:hover { background: var(--sidebar-hover); }
      #sidebar .side-row.active { background: var(--sidebar-selected); }
      #sidebar .avatar { background: var(--sidebar-selected); }
      #sidebar .create-pill, #sidebar .sidebar-add-rail { border-color: var(--sidebar-line); }
      #sidebar .profile-wrap { border-top-color: var(--sidebar-line); }
      #sidebar::-webkit-scrollbar-thumb { background: var(--sidebar-selected); border: 2px solid transparent; background-clip: padding-box; }
      #sidebar { scrollbar-color: var(--sidebar-selected) transparent; }

      /* ---------- Responsive ---------- */
      /* ≥1280px — reference layout */
      @media (min-width: 1280px) {
        #sidebar { width: 300px; }
        #sidebar.rail { width: 64px; }
      }
      /* 900–1279px — slightly narrower sidebar, still roomy rows */
      @media (max-width: 1279px) and (min-width: 900px) {
        #sidebar { width: 268px; padding: 8px 18px 14px; }
        #sidebar.rail { width: 64px; padding: 9px 8px 10px; }
        .mini-day { height: 32px; font-size: 12.5px; }
        .cal-row { min-height: 44px; }
        .side-row { min-height: 42px; }
        #headerBand { padding-left: 22px; padding-right: 22px; }
      }
      @media (max-width: 1100px) {
        .head-right { gap: 2px; }
      }
      @media (hover: none) {
        .cal-menu-btn { opacity: 1; }
      }
      /* 640–899px — sidebar auto-collapses to the icon rail */
      @media (max-width: 899px) and (min-width: 640px) {
        #sidebar { width: 64px !important; padding: 9px 8px 10px; }
        #collapseBtn { display: none !important; }
        #sidebar .rail-hide { display: none !important; }
        #sidebar .side-label { display: none !important; }
        #sidebar .brand-row { justify-content: center; padding-left: 0; padding-right: 0; }
        #sidebar .cal-list { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
        #sidebar .cal-row { justify-content: center; padding: 8px 0; width: 44px; height: 40px; min-height: 40px; margin: 0 auto; }
        #sidebar .cal-name, #sidebar .cal-menu-btn { display: none !important; }
        #sidebar .cal-check { width: 22px; height: 22px; }
        #sidebar .side-row { justify-content: center; padding: 9px 0; }
        #sidebar .profile-wrap { display: flex; justify-content: center; }
        #sidebar .profile-row { justify-content: center; padding: 4px 0; width: auto; }
        #sidebar .side-spacer { min-height: 12px; }
        .create-pill { width: 44px; height: 44px; border-radius: 14px; align-self: center; margin-left: auto; margin-right: auto; }
        .create-pill .create-main { width: 44px; height: 44px; padding: 0; justify-content: center; }
        .create-pill .create-label, .create-pill .create-chev { display: none !important; }
        .sidebar-add-rail { width: 48px; height: 48px; }
        #headerBand { padding-left: 20px; padding-right: 20px; gap: 12px; }
      }
      /* Below 640px — phones: off-canvas drawer sidebar, full-width main */
      @media (max-width: 639px) {
        html, body { height: var(--dl-app-h, 100dvh); }
        #app { height: calc(var(--dl-app-h, 100dvh) - var(--dl-banner-h, 0px)); }
        #main { width: 100%; min-width: 0; }
        #sidebar {
          display: none;
          position: fixed; top: var(--dl-banner-h, 0px); left: 0; bottom: 0; height: calc(var(--dl-app-h, 100dvh) - var(--dl-banner-h, 0px)); z-index: 390;
          width: min(324px, 88vw) !important; padding: 20px 20px 14px;
          box-shadow: var(--shadow-pop);
        }
        #sidebar.drawer-open { display: flex; animation: drawerIn 240ms var(--ease-spring); }
        @keyframes drawerIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        #collapseBtn { display: none !important; }
        .hamburger-btn { display: inline-flex !important; width: 36px; height: 36px; min-width: 36px; flex: none; }
        #headerBand { flex-wrap: wrap; padding: 8px 12px; gap: 8px; min-height: 54px; overflow: visible; row-gap: 8px; }
        .head-right { gap: 4px; flex: none; margin-left: auto; width: auto; }
        .back-btn { height: 34px; padding: 0 11px; }
        /* Month on phones */
        .day-cell { padding: 4px 3px 3px; }
        .day-num { width: 24px; height: 24px; font-size: 12px; }
        .chip { padding: 2px 5px 2px 8px; font-size: 11px; min-height: 20px; border-radius: var(--r-xs); }
        .chip .chip-time { display: none; }
        .chip.seg-mid, .chip.seg-start, .chip.seg-end { min-height: 20px; }
        .dow-cell { padding: 7px 4px; font-size: 10.5px; text-align: center; }
        .more-link { font-size: 11px; padding: 1px 2px; letter-spacing: -0.01em; white-space: nowrap; }
        .cell-add { display: none !important; }
        /* Week on phones: horizontal scroll, columns keep min-width. Day stays full width via its single column exceeding? — week grid min-width applies only when it has 7 columns (inline min via wrap) */

        .set-row.switch-row:not(:has(.switch)) > span:first-child { padding-right: 0; }

        /* Popovers / menus / palette */
        .menu { max-width: calc(100vw - 24px); }

          left: 12px !important; right: 12px; top: auto !important; bottom: 12px;

        .settings-dialog { width: calc(100vw - 16px); max-width: calc(100vw - 16px); height: calc(100dvh - 16px); max-height: calc(100dvh - 16px); }

      /* Reduced motion (Emil/Apple): fewer and gentler, not zero — keep the
         opacity/colour transitions that aid comprehension, drop all
         transform/position movement. Scoped to the app, never the auth
         screens, which carry their own reduced-motion rules. */
      @media (prefers-reduced-motion: reduce) {
        #app *, #app *::before, #app *::after, #overlayRoot *, #toastRoot *,
        body > .menu, body > .popover, body > .date-pop {
          animation: none !important;
          transition-property: opacity, background-color, color, border-color, box-shadow !important;
          transition-duration: 80ms !important;
        }

      body.reduce-motion #app *, body.reduce-motion #app *::before, body.reduce-motion #app *::after,
      body.reduce-motion #overlayRoot *, body.reduce-motion #toastRoot *,
      body.reduce-motion > .menu, body.reduce-motion > .popover, body.reduce-motion > .date-pop {
        /* Shorten, never remove: `animation: none` made every element that declares an
           entrance animation START it again the moment Reduce motion was switched off
           (backdrop, dialog, panes, save pill replayed). With only the duration changed,
           animations that already finished stay finished in both directions. */
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-property: opacity, background-color, color, border-color, box-shadow !important;
        transition-duration: 80ms !important;

      /* ---------- Auth (login / sign up) — Cosmos-inspired, flipped ----------

         restrained art moment. Dark = the app's near-black canvas
         (#121212) with the #1e1e1e sidebar tone for cards, #282828 /
         #2e2e2e fields, and a near-white pill CTA. Light = white

      [data-theme="dark"] {

      [data-theme="light"] {
        --auth-bg: #ffffff;
        --auth-visual: #f5f5f5;
        --auth-field: #f5f5f5;
        --auth-field-hover: #ebebeb;
        --auth-text: #171717;
        --auth-muted: #737373;
        --auth-faint: #a3a3a3;
        --auth-primary-bg: #171717;
        --auth-primary-text: #ffffff;
        --auth-primary-hover: #2e2e2e;
        --auth-hairline: #e5e5e5;
        --auth-ghost-border: #d4d4d4;
        --auth-ghost-hover: rgba(23, 23, 23, 0.04);
        --auth-tile: rgba(23, 23, 23, 0.045);
        --auth-tile-num: rgba(23, 23, 23, 0.55);
        --auth-glow: rgba(26, 115, 232, 0.10);
        --auth-card: #ffffff;
        --auth-card-line: #e5e5e5;
        --auth-danger: #d93025;
        --auth-danger-soft: rgba(217, 48, 37, 0.10);

      #app[hidden] { display: none !important; }
      #authScreen { position: fixed; inset: 0; z-index: 900; display: flex; background: var(--auth-bg); color: var(--auth-text); overflow-y: auto; font-family: var(--font); }

      @keyframes authFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

      /* Form side (left) */
      .auth-form-panel { flex: 0 0 45%; min-width: 380px; position: relative; display: flex; flex-direction: column; padding: 22px 28px 26px; background: var(--auth-bg); border-right: 1px solid var(--auth-hairline); }

      .auth-topbar .auth-brand-mark .daylight-mark { display: block; width: 34px; height: 34px; object-fit: contain; }
      .auth-topbar .auth-brand-mark .daylight-mark-dark { display: none; }

      .auth-theme-btn { width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--auth-ghost-border); background: transparent; color: var(--auth-muted); display: inline-flex; align-items: center; justify-content: center; flex: none; transition: background 120ms, color 120ms; }
      .auth-theme-btn:hover { color: var(--auth-text); background: var(--auth-ghost-hover); }

      .auth-form-inner { display: flex; flex-direction: column; width: 100%; transition: opacity 160ms ease, transform 160ms ease, height 300ms cubic-bezier(0.22, 0.8, 0.3, 1); }

      /* Mode switch: old group fades/drifts out, new group fades in with a

      .auth-form-inner.switch-out { opacity: 0; transform: translateY(6px); }
      .auth-form-inner.switch-in { animation: authSwitchIn 280ms cubic-bezier(0.22, 0.8, 0.3, 1) both; }
      @keyframes authSwitchIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .auth-mark { display: flex; justify-content: center; margin-bottom: 24px; }
      .auth-mark .daylight-mark { width: 44px; height: 44px; display: block; object-fit: contain; }
      .auth-mark .daylight-mark-dark { display: none; }
      [data-theme="dark"] .auth-mark .daylight-mark-light { display: none; }
      [data-theme="dark"] .auth-mark .daylight-mark-dark { display: block; }
      .auth-headline { font-family: var(--font); font-size: 40px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; text-align: center; margin: 0; }
      .auth-altline { text-align: center; font-size: 13.5px; color: var(--auth-muted); margin: 10px 0 0; }
      .auth-altline button { color: var(--auth-muted); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--auth-faint); transition: color 120ms; }
      .auth-altline button:hover { color: var(--auth-text); }
      .auth-fields { margin-top: 36px; display: flex; flex-direction: column; }
      .auth-pill { position: relative; display: flex; flex-direction: column; justify-content: center; height: 64px; border-radius: 999px; background: var(--auth-field); border: 1px solid transparent; padding: 11px 52px 9px 23px; cursor: text; transition: background 120ms, border-color 120ms, box-shadow 120ms; }
      .auth-pill:hover { background: var(--auth-field-hover); }
      .auth-pill:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); background: var(--auth-field-hover); }
      .auth-pill.err { border-color: color-mix(in srgb, var(--auth-danger) 52%, transparent); background: color-mix(in srgb, var(--auth-field) 90%, var(--auth-danger) 10%); box-shadow: 0 0 0 3px var(--auth-danger-soft); }
      .auth-pill.err:hover { background: color-mix(in srgb, var(--auth-field-hover) 90%, var(--auth-danger) 10%); }
      .auth-pill.err:focus-within { border-color: color-mix(in srgb, var(--auth-danger) 62%, transparent); box-shadow: 0 0 0 3px var(--auth-danger-soft); background: color-mix(in srgb, var(--auth-field-hover) 90%, var(--auth-danger) 10%); }
      .auth-pill-label { font-size: 10.5px; font-weight: 500; letter-spacing: 0.03em; color: var(--auth-muted); line-height: 1.25; pointer-events: none; }
      .auth-pill-input { background: none; border: none; outline: none; width: 100%; font-size: 15px; line-height: 1.3; color: var(--auth-text); padding: 1px 0 0; height: 21px; }
      .auth-pill-input::placeholder { color: var(--auth-faint); }
      /* Right-edge slot (52px reserved by the pill padding, so nothing ever

      .auth-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) scale(1); width: 38px; height: 38px; border-radius: 50%; color: var(--auth-muted); display: inline-flex; align-items: center; justify-content: center; transition: background 120ms, color 120ms, opacity 150ms ease, transform 200ms cubic-bezier(0.34, 1.4, 0.64, 1), visibility 150ms; z-index: 2; }
      .auth-eye:hover { color: var(--auth-text); background: var(--auth-ghost-hover); }
      .auth-pill.err .auth-eye { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-50%) scale(0.55); }
      .auth-hazard-wrap { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) scale(0.55); width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; z-index: 3; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 150ms ease, transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1), visibility 150ms; }
      .auth-pill.err .auth-hazard-wrap { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(-50%) scale(1); }
      .auth-hazard { width: 38px; height: 38px; border-radius: 50%; color: var(--auth-danger); display: inline-flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; transition: background 120ms, transform 120ms; }
      .auth-hazard:hover, .auth-hazard:focus-visible { background: var(--auth-danger-soft); }
      .auth-hazard:focus-visible { outline: 2px solid var(--auth-danger); outline-offset: 1px; }
      .auth-tip { position: absolute; bottom: calc(100% + 4px); right: -6px; width: max-content; max-width: min(248px, 68vw); background: var(--auth-tip-bg); color: var(--auth-tip-text); font-size: 12.5px; font-weight: 500; line-height: 1.4; text-align: left; white-space: normal; padding: 8px 11px; border-radius: 10px; box-shadow: var(--auth-tip-shadow); opacity: 0; visibility: hidden; transform: translateY(4px) scale(0.97); transform-origin: bottom right; transition: opacity 150ms ease, transform 190ms cubic-bezier(0.22, 0.8, 0.3, 1), visibility 150ms; pointer-events: none; z-index: 30; }
      .auth-tip::after { content: ""; position: absolute; top: 100%; right: 17px; border: 6px solid transparent; border-top-color: var(--auth-tip-bg); border-bottom: 0; }
      .auth-hazard-wrap:hover .auth-tip, .auth-hazard-wrap:focus-within .auth-tip, .auth-hazard-wrap.tip-open .auth-tip { opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto; }
      /* The error copy itself is screen-reader only (announced via the
         input's aria-describedby + aria-invalid): the hazard tooltip is
         the one visible message, so nothing doubles up. The space below

      .auth-error { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
      /* Password requirements — plain list directly under the password
         pill (sign-up + reset step 2), no box or header. Hidden while

         or padding of its own, so the form keeps its normal rhythm and
         there is no dead gap. The first keystroke adds .show and the
         list reveals with a fade + smooth height/slide

         min-height:0 + overflow:hidden is what lets 0fr actually reach
         zero). Clearing the field removes .show and it animates back
         out. Spacing is deliberate: the list is indented to the pill's
         text edge, rows share one even gap and one aligned badge

      .auth-reqs-clip { min-height: 0; overflow: hidden; }

      .auth-reqs-list .auth-rule { font-size: 13px; line-height: 1.45; gap: 10px; }
      .auth-reqs-list .auth-rule .rule-ic { width: 18px; height: 18px; }

      @media (max-width: 380px) { .auth-reqs-list { padding-left: 20px; } }
      .auth-rule { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--auth-muted); line-height: 1.35; transition: color 240ms ease; }
      .auth-rule .rule-ic { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--auth-ghost-border); display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; transition: background 220ms ease, border-color 220ms ease; }

      .auth-rule .rule-ic svg path { stroke-dasharray: 26; stroke-dashoffset: 26; opacity: 0; transition: stroke-dashoffset 280ms ease 70ms, opacity 140ms ease; }
      .auth-rule.ok { color: var(--auth-text); }
      .auth-rule.ok .rule-ic { background: #22a06b; border-color: #22a06b; animation: rulePop 340ms cubic-bezier(0.34, 1.56, 0.64, 1); }

      .auth-primary { width: 100%; height: 50px; margin-top: 8px; border-radius: 999px; background: var(--auth-primary-bg); color: var(--auth-primary-text); font-size: 15.5px; font-weight: 600; letter-spacing: 0.005em; display: inline-flex; align-items: center; justify-content: center; transition: background 120ms, transform 120ms, opacity 120ms; }

      .auth-social { position: relative; width: 100%; height: 54px; border-radius: 999px; border: 1px solid var(--auth-ghost-border); background: transparent; color: var(--auth-text); font-size: 14.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; transition: background 120ms, border-color 120ms; }
      .auth-social:hover { background: var(--auth-ghost-hover); }

      .auth-terms { font-size: 12px; line-height: 1.55; color: var(--auth-muted); text-align: center; margin: 14px 10px 0; }
      .auth-terms a { color: var(--auth-text); text-decoration: underline; text-underline-offset: 2px; }
      .auth-subline { text-align: center; font-size: 14px; line-height: 1.5; color: var(--auth-muted); margin: 12px 8px 0; }

      .auth-success .ok-ic { width: 18px; height: 18px; border-radius: 50%; background: #22a06b; color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
      .auth-back-row { display: flex; justify-content: center; margin-top: 17px; }
      .auth-back { font-size: 13.5px; color: var(--auth-muted); transition: color 120ms; }
      .auth-back:hover { color: var(--auth-text); text-decoration: underline; text-underline-offset: 3px; }
      /* Forgot password — 6-digit code */
      .auth-code-wrap { margin-top: 36px; }

/* Moved from late-loading scripts / end-of-body so the first paint is final. */
/* Presentation pass: calendar menu, chooser/forms and Profile pane styles live with their scripts; this block holds first-paint layout and the shared popup standard. */

.cal-row{align-items:center;min-height:28px;height:30px;gap:7px}
.cal-row .cal-name{flex:1 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.cal-row .cal-menu-btn{flex:0 0 28px}
.cal-row .cal-check{flex:0 0 auto}
.dl-color-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:8px 0}
.dl-color-grid .dl-color-item{height:25px;min-width:0;width:100%;border-radius:9px;position:relative;border:2px solid transparent;outline-offset:2px;cursor:pointer}
.dl-color-grid .dl-color-item:not(.dl-color-plus){box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
[data-theme="dark"] .dl-color-grid .dl-color-item:not(.dl-color-plus){box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.dl-color-grid .dl-color-item[aria-pressed=true]{outline:2px solid var(--text)}
.dl-color-grid .dl-color-item:focus-visible{outline:2px solid var(--accent)}
.dl-color-entry{position:relative;display:block;min-width:0}
.dl-color-remove{position:absolute;right:-5px;top:-5px;z-index:2;width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);font-size:13px;line-height:16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.dl-color-remove:hover{background:var(--hover);color:var(--danger)}
.dl-color-remove:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dl-color-plus{border:1px solid var(--line)!important;background:var(--surface);color:var(--text);font-size:19px;font-weight:500}
.dl-color-label{font-size:11px;color:var(--muted);margin:9px 0 2px;font-weight:600}
.dl-color-square{height:172px;border-radius:12px;position:relative;cursor:crosshair;touch-action:none;background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent);border:1px solid var(--line)}
.dl-color-point{position:absolute;height:14px;width:14px;border:2px solid #fff;box-shadow:0 0 0 1px #333;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.dl-color-hue{display:block;width:100%;height:18px;margin:12px 0;appearance:none;border-radius:999px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer}
.dl-color-hue::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border:2px solid white;border-radius:50%;background:#555;box-shadow:0 0 0 1px #333}
.dl-color-hue::-moz-range-thumb{width:14px;height:14px;border:2px solid white;border-radius:50%;background:#555;box-shadow:0 0 0 1px #333}
.dl-color-preview{height:28px;width:28px;flex:none;border-radius:8px;border:1px solid var(--line)}
.dl-color-rgb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dl-color-rgb .field{margin:0}
.dl-color-rgb input{width:100%;min-width:0}
.dl-color-error{font-size:12px;color:var(--danger);min-height:16px}
.dl-inline-picker{display:grid;gap:10px}
.dl-inline-picker .dl-color-square{height:150px}
.dl-inline-picker .dl-color-hue{margin:2px 0}
.dl-inline-values{display:grid;grid-template-columns:34px minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.dl-inline-values .dl-color-preview{width:34px;height:34px;border-radius:10px}
.dl-inline-field{display:grid;gap:4px;min-width:0}
.dl-inline-field>span{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.04em}
.dl-inline-field .text-input{height:34px;padding:0 10px;min-width:0;width:100%;font-variant-numeric:tabular-nums;border-radius:10px}
.dl-inline-picker .dl-color-error{min-height:0}
/* compact: one spectrum bar + one row of HEX / R / G / B (no square, no preview chip) */
.dl-inline-picker.dl-compact{gap:0}
.dl-compact .dl-color-square,.dl-compact .dl-color-preview{display:none}
.dl-compact .dl-color-hue{height:10px;border-radius:5px;margin:12px 0 10px}
.dl-compact .dl-color-hue::-webkit-slider-thumb{width:16px;height:16px;border:2px solid #fff;background:var(--cs-thumb,#555);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3)}
.dl-compact .dl-color-hue::-moz-range-thumb{width:12px;height:12px;border:2px solid #fff;background:var(--cs-thumb,#555);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.dl-compact .dl-inline-values{grid-template-columns:minmax(0,1fr) 54px 54px 54px;gap:6px;align-items:stretch}
.dl-compact .dl-inline-field{display:flex;flex-direction:row;align-items:center;gap:6px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);min-width:0}
.dl-compact .dl-inline-field>span{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;color:var(--muted);flex:none}
.dl-compact .dl-inline-field .text-input{border:0;background:transparent;box-shadow:none;height:auto;padding:0;border-radius:0;font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);min-width:0;width:100%;appearance:textfield;-moz-appearance:textfield}
.dl-compact .dl-inline-field .text-input::-webkit-outer-spin-button,.dl-compact .dl-inline-field .text-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dl-compact .dl-inline-field:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.dl-color-empty{font-size:12px;color:var(--muted);padding:2px 0 4px}
.dl-color-remove{opacity:.9}
.dl-color-modal .dialog-body{display:grid;gap:10px}
.dl-color-modal .dialog-body .field{margin:0}
.month-wrap{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.month-grid{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;grid-template-rows:repeat(6,minmax(var(--month-row-min,92px),1fr));scrollbar-gutter:stable;align-content:stretch}
.month-week{min-height:var(--month-row-min,92px);height:100%;overflow:visible}
.day-cell{min-height:0;overflow:hidden}
.cell-events{min-height:0;overflow:visible}
.agenda-cal-name{font-weight:600;color:var(--muted)}

@media(max-height:750px){.dow-cell{padding-top:5px;padding-bottom:5px}.day-cell{padding-top:2px;padding-bottom:1px}.day-num{height:22px;min-height:22px}}
@media(prefers-reduced-motion:reduce){.dl-color-modal,.dl-color-modal *{animation:none!important;transition:none!important}}


/* Daylight sidebar: stable single-line labels and compact adaptive rows. */
.cal-row .cal-name,.cal-row .fr-url{white-space:nowrap!important;text-overflow:ellipsis!important;overflow:hidden!important;min-width:0!important}
.cal-row{height:var(--dl-cal-row-height,30px)!important;min-height:0!important;flex-shrink:1!important}
.sidebar .cal-list,.sidebar .calendars-list{min-height:0}
.sidebar .cal-check{flex-shrink:0}
.sidebar.collapsed .cal-check,.sidebar.rail .cal-check,
.sidebar.collapsed .cal-visibility-btn,.sidebar.rail .cal-visibility-btn{display:none!important}
.dl-rail-tooltip{position:fixed;z-index:99999;pointer-events:none;padding:7px 10px;border-radius:7px;background:var(--surface2);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow-pop);font-size:12px;font-weight:500;white-space:nowrap;animation:dlTipIn 120ms var(--ease-out)}
@keyframes dlTipIn{from{opacity:0;transform:translateX(-3px)}to{opacity:1;transform:translateX(0)}}


.dl-month-span-layer,.dl-week-span-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.dl-continuous-bar{position:absolute;pointer-events:auto;height:23px;border-radius:6px;padding:2px 8px 2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;transition:filter 160ms cubic-bezier(.23,1,.32,1),box-shadow 160ms cubic-bezier(.23,1,.32,1)}
.dl-continuous-bar:hover,.dl-continuous-bar.dl-span-active,.dl-continuous-bar.dl-span-selected{filter:brightness(1.15);outline:1px solid currentColor;outline-offset:-1px}
@media(prefers-reduced-motion:reduce){.dl-continuous-bar{transition:none}}

.agenda-details{display:flex;flex-direction:column;min-width:0;gap:3px}.agenda-location{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;line-height:1.3;white-space:normal;overflow-wrap:anywhere}.agenda-location svg{flex:none}

/* ===== The Look: every popup follows Create Event (shell, header, fields, buttons) and Settings (grouped cards, section labels) =====
   Header: plain surface, no tint, no divider, 18px semibold title, 36px X top-right. Body: 24px sides. Fields: one rule (44px, 12px radius,
   the Create Event fill, blue focus ring); never nested in a card. Buttons: right-aligned footer, no divider, Cancel/Back = outline,
   primary = solid black (white in Dark), destructive = solid red, a disabled primary is grey. */
.dialog.dl-std .dialog-head, .dialog.dl-chooser .dialog-head, .dialog.dl-form .dialog-head, .dialog.dl-look .dialog-head { padding: 20px 14px 0 24px; gap: 8px; border: 0; background: transparent; }
.dialog.dl-std .dialog-body, .dialog.dl-form .dialog-body, .dialog.dl-look .dialog-body { padding: 18px 24px 8px; }
.dialog.dl-chooser .dialog-body { padding: 18px 24px 24px; }
.dialog.dl-std .dialog-foot, .dialog.dl-form .dialog-foot, .dialog.dl-look .dialog-foot { padding: 14px 24px 22px; gap: 10px; border: 0; justify-content: flex-end; }
.dialog.dl-std .text-input, .dialog.dl-form .text-input, .dialog.dl-look .text-input { height: 44px; border-radius: 12px; padding: 0 16px; font-size: 14px; }
.dialog.dl-std .field label, .dialog.dl-form .field label, .dialog.dl-look .field label { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-bottom: 8px; }
.dialog.dl-std .dl-std-field, .dialog.dl-form .dl-std-field { margin-bottom: 18px; }
.dialog.dl-std .btn-primary:disabled, .dialog.dl-form .btn-primary:disabled, .dialog.dl-look .btn-primary:disabled { background: var(--auth-primary-bg); color: var(--auth-primary-text); opacity: var(--dl-disabled-opacity); box-shadow: none; filter: none; }
.dialog.dl-std .set-group-title, .dialog.dl-look .set-group-title { font-size: 11px; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; }
/* Confirmations: a readable body width and count phrases ("1 event") that never split across lines. */
.dl-confirm .dialog-body p { max-width: 38ch; text-wrap: pretty; overflow-wrap: break-word; }
/* ICS drop zone: a Settings-style card with a solid hairline border (the app's only dashed element is gone). */
.dl-drop { border: 1px solid var(--line-soft); background: var(--gray-2); border-radius: 16px; min-height: 140px; }
.dl-drop:hover, .dl-drop.is-over, .dl-drop:focus-visible { background: var(--hover); border-color: var(--line); }
.swatches.dl-cp { display: block; }
.dl-chooser .dl-opt { border-radius: 16px; padding: 16px; }
.dialog .dl-drop .dl-browse { height: 32px; padding: 0 14px; border-radius: 999px; margin: 0 0 0 4px; font-size: 13px; }
.dialog.dl-form .dl-drop { border-radius: 16px; }

/* Event popover: the calendar chip lines up with the colour square (the title row's left edge), not with the title text. */
.popover .pop-head .pop-cal-line { margin-left: -30px; margin-top: 10px; }
.popover .pop-top .icon-btn[data-act="share"] { width: 34px; height: 34px; }
/* The Share view lives INSIDE the popover (same popover, width and position). */
.popover.is-sharing { width: min(384px, calc(100vw - 16px)); max-height: min(620px, calc(100dvh - 16px)); display: flex; flex-direction: column; overflow: hidden; }
.dl-share-view { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.dl-sv-head { display: flex; align-items: center; gap: 4px; margin: 0 -6px 0 -8px; flex: none; }
.dl-sv-head .icon-btn { width: 34px; height: 34px; border-radius: 50%; flex: none; }
.dl-sv-head .icon-btn:hover { background: var(--hover); }
.dl-sv-title { flex: 1; font-size: 18px; font-weight: 600; letter-spacing: -0.012em; padding-left: 4px; }
.dl-sv-event { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 8px 0 16px; padding-left: 2px; font-size: 13.5px; line-height: 1.4; }
.dl-sv-event .dl-sv-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; align-self: center; }
.dl-sv-event b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.dl-sv-event span.when { color: var(--muted); flex-basis: 100%; padding-left: 22px; margin-top: -6px; }
.dl-sv-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px 4px; }
.dl-sv-label { font-size: 11px; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin: 20px 0 6px; }
.dl-sv-row2 { display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-top: 12px; }
.dl-sv-row2 .dl-inv-perm { height: 40px; border-radius: 12px; }
.dl-sv-row2 .dl-inv-send { height: 36px; border-radius: 8px; padding: 0 20px; margin: 0; }
.dl-sv-row2 .dl-inv-send:disabled { background: var(--auth-primary-bg); color: var(--auth-primary-text); opacity: var(--dl-disabled-opacity); }
.dl-share-view .dl-inv-field { height: 44px; border-radius: 12px; width: 100%; flex: none; }
.dl-sv-quiet { font-size: 13px; color: var(--faint); padding: 10px 0 4px; }
.dl-sv-owner .dl-ppl-sub { display: block; }

/* ===== Finish and feel: one depth language, one motion system (visual finish only; no layout, size, copy or color changes) =====
   Motion: enters 190ms ease-out (fade + 0.96 scale), exits 170ms ease-in (the same motion in reverse), feedback 160ms ease-out;
   only transform and opacity animate. Depth: every floating surface uses --shadow-pop and the 12px popup radius (Settings and the
   palette keep their 16px). */
:root { --dl-ease-out: cubic-bezier(0.23, 1, 0.32, 1); --dl-ease-in: cubic-bezier(0.4, 0, 1, 1); }
.dialog:not(.settings-dialog), .menu, .date-pop, .popover, .dl-notif-panel, .dd-menu { box-shadow: var(--shadow-pop) !important; }
.date-pop, .dd-menu { border-radius: 12px; }
.dl-notif-panel { animation: dl-overlay-show .19s var(--dl-ease-out) both; }
.dl-place-options { animation-duration: .19s; animation-timing-function: var(--dl-ease-out); }
/* Press and hover feedback on every kind of button (transform + opacity only: no size or position change). */
.btn-primary, .btn-ghost, .btn-danger, .btn-danger-outline, .icon-btn, .pop-banner-btn, .create-main, .side-row, .mini-nav, .side-label-btn, .dl-opt, .dl-person, .dl-ppl-ctl, .dl-cp-toggle, .menu-item {
  transition: background-color 160ms var(--dl-ease-out), color 160ms var(--dl-ease-out), border-color 160ms var(--dl-ease-out), filter 160ms var(--dl-ease-out), transform 160ms var(--dl-ease-out);
}
.btn-primary:active, .btn-ghost:active, .btn-danger:active, .btn-danger-outline:active, .icon-btn:active, .pop-banner-btn:active, .create-main:active, .dl-opt:active, .dl-cp-toggle:active { transform: scale(0.98); }
/* Primary buttons: a clearly visible hover tint and a real press. (The old brightness() filter cancelled the background change in dark, so nothing showed.) */
[data-theme="dark"] { --dl-primary-hover: #ffffff; --dl-primary-active: #b4b4b4; }
[data-theme="light"] { --dl-primary-hover: #4d4d4d; --dl-primary-active: #000000; }
.btn-primary:not(:disabled):hover { filter: none; background: var(--dl-primary-hover); box-shadow: 0 3px 10px color-mix(in srgb, var(--text) 16%, transparent); }
.btn-primary:not(:disabled):active { filter: none; background: var(--dl-primary-active); box-shadow: none; transform: scale(0.97); }
.btn-danger-outline:hover { background: color-mix(in srgb, var(--danger) 8%, transparent); }
.btn-primary:disabled:active, .btn-ghost:disabled:active { transform: none; }
/* Calendar: day cells and events respond gently to the pointer. */
.day-cell { transition: background-color 160ms var(--dl-ease-out); }
.chip, .dl-continuous-bar, .ev-card, .allday-bar { transition: filter 160ms var(--dl-ease-out), transform 160ms var(--dl-ease-out), box-shadow 160ms var(--dl-ease-out); }
.chip:hover, .dl-continuous-bar:hover { transform: translateY(-1px); }
.chip:active, .dl-continuous-bar:active { transform: scale(0.99); }
.cal-row, .profile-row { transition: background-color 160ms var(--dl-ease-out); }
.task-results { transition: opacity 110ms var(--dl-ease-in); }
.task-results.is-out { opacity: 0; }
.task-results.is-in { animation: viewFade 200ms var(--dl-ease-out); }
body.reduce-motion .task-results, body.reduce-motion .task-results.is-in { animation: none !important; transition: none !important; }
/* Round 10 polish: no dead space under the last field of a standard dialog (its 16px field margin stacked on the body padding), and
   primary buttons inside cards and pages start on the card's text edge instead of the 8px footer-gap margin. */
.dialog.dl-std .dialog-body > .field:last-child { margin-bottom: 0; }
.dl-page .btn-primary, .dl-page .dl-ad-actions .btn-primary, .set-group .dl-ad-actions .btn-primary { margin-left: 0; }
/* Calendar views (Round 11). Month: even chip insets and ONE "today" treatment (the filled number; no tinted cell as well). */
.day-cell { padding: 6px 5px 5px 6px; }
.day-cell:last-child { padding-right: 6px; }
.day-cell.today { background: transparent; }
.day-cell.today.sel, .day-cell.sel { background: color-mix(in srgb, var(--accent) 6%, transparent); }
/* Time grid: the 12 AM label sits inside the grid; the GMT label shares the hour labels' right edge; the now-pill sits in the grid on the
   line (never over the hour labels). */
.hour-label.is-first { transform: none; top: 4px !important; }
.tg-gutter-head { align-items: flex-end; padding-right: 9px; font-size: 11px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.tg-wrap .now-pill { left: calc(var(--tg-gutter) + 6px); right: auto; transform: translateY(-100%); margin-top: -1px; border-radius: 6px 6px 6px 2px; }
.hour-label { z-index: 7; }
/* Day view: a one-hour event is not a screen-wide slab */
.tg-day .ev-card { max-width: 720px; }
/* Agenda and Tasks share one content column (same width, same left edge), and the agenda ends with a quiet line */
.agenda-inner, .tasks-inner { max-width: 880px; }
.agenda-end { text-align: center; font-size: 13px; color: var(--faint); padding: 28px 0 8px; }
/* Sidebar rhythm: ONE row height, ONE section gap (the same under Create as under the mini calendar); the spare space sits above the account block. */
#sidebar:not(.rail) { --sb-gap: 16px; }
@media (max-height: 859px) { #sidebar:not(.rail) { --sb-gap: 10px; } }
@media (max-height: 799px) { #sidebar:not(.rail) { --sb-gap: 8px; } }
@media (min-height: 940px) { #sidebar:not(.rail) { --sb-gap: 20px; } }
#sidebar:not(.rail) .create-pill { margin-bottom: var(--sb-gap); }
#sidebar:not(.rail) #miniWrap { padding-bottom: var(--sb-gap); }
#sidebar:not(.rail) .side-row, #sidebar:not(.rail) .side-row[data-side-row], #sidebar:not(.rail) .side-row[title="Settings"] { min-height: calc(var(--sb-row-h) - 4px); padding-top: calc(var(--sb-row-py) - 1px); padding-bottom: calc(var(--sb-row-py) - 1px); }
/* the row action buttons (gear, +) are never invisible-only: they show on hover, on keyboard focus anywhere in the row, and on touch */
.cal-row:focus-within .cal-menu-btn, .side-label:focus-within .side-label-btn.add { opacity: 1; }
@media (hover: none) { .cal-menu-btn, .side-label-btn.add { opacity: 1; } }
/* Tasks: the empty state centers in the space that remains */
.task-results:has(> .empty-state) { min-height: calc(100dvh - 400px); display: flex; align-items: center; justify-content: center; }
/* Auth pages: one button height (the Log in / Create pill matches the Google and passkey pills), a balanced terms line, and a real
   "Back to sign in" button. */
.auth-primary, .auth-social, .auth-methods .auth-social { height: 50px; }
.auth-terms { text-wrap: balance; }
.auth-back { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--auth-ghost-border); font-size: 14px; font-weight: 550; color: var(--auth-muted); }
.auth-back:hover { background: var(--auth-ghost-hover); color: var(--auth-text); text-decoration: none; }
.auth-headline.is-one-line { white-space: nowrap; }
/* The Create menu is as wide as the sidebar column, so it covers the mini calendar's next-month arrow instead of leaving a stray ">" at the Event row's edge. */
.menu.dl-create-menu { width: min(260px, calc(100vw - 24px)); }
/* ONE disabled rule for the whole app: the control keeps its own look and drops to the standard disabled opacity. */
:root { --dl-disabled-opacity: 0.55; }
.btn-primary:disabled, .btn-ghost:disabled, .btn-danger:disabled, .btn-danger-outline:disabled, .dd.disabled, .dd[aria-disabled="true"], .switch input:disabled + .slider, select:disabled, button.picker-btn:disabled { opacity: var(--dl-disabled-opacity); cursor: default; }
/* ONE field treatment in every dialog: grey at rest; the elevated surface with the blue ring on focus (text, text area, pickers, dropdowns). */
.dialog .text-input, .dialog .text-area, .dialog .picker-btn, .dialog .dd { background: var(--input-bg); }
.dialog .text-input:focus, .dialog .text-area:focus, .dialog .picker-btn:focus, .dialog .picker-btn:focus-visible, .dialog .dd:focus-visible, .dialog .dd.open {
  background: var(--surface); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); outline: none; }
.dialog .text-input:disabled, .dialog .text-input[readonly] { background: transparent; }
/* ONE label-to-field gap in every dialog */
.dialog .field > label, .dialog .field > .field-label { display: block; margin-bottom: 10px; }
/* The main calendar's lines and finish: hairlines at the same weight and color as Settings' dividers (the header rule used the heavier
   --line, and every cell edge was a full-strength line); events get the app's chip finish (8px radius, same padding). Lines and finish only. */
.dow-row, .tg-head { border-bottom-color: var(--line-soft); }
.month-week { border-bottom-color: color-mix(in srgb, var(--line-soft) 78%, transparent); }

          var h = el('<div class="tg-day-head' + (isToday ? " today" : "") + '"><span class="dow">' + DOWS_S[date.getDay()] + '</span><button class="dnum">' + date.getDate() + "</button></div>");
          h.querySelector(".dnum").addEventListener("click", function () { if (numDays > 1) drillToDay(date); });
          head.appendChild(h);
        });
        wrap.appendChild(head);
        var adRow = el('<div class="allday-row" style="grid-template-columns:' + gridCols + '"></div>');
        adRow.appendChild(el('<div class="allday-label">All-day</div>'));
        var weekSpans=occs.filter(function(o){return numDays>1&&isMultiDay(o)});
        days.forEach(function(date){
          var cell=el('<div class="allday-cell"></div>');
          if(weekSpans.length)cell.style.paddingTop=(weekSpans.length*27+3)+"px";
          occs.filter(function(o){return o.ev.allDay&&(numDays===1||!isMultiDay(o))&&coversDay(o,date)})
            .forEach(function(o){
              var cal=calOf(o.ev.cal),bar=el('<button class="allday-bar" style="background:'+tintOf(cal,o.ev)+';color:'+tintTextOf(cal,o.ev)+';box-shadow:'+ribbonOf(cal,o.ev)+'">'+esc(o.ev.title)+'</button>');
              bar.setAttribute("data-calendar-id",o.ev.cal);
              bar.addEventListener("click",function(e){e.stopPropagation();openPopover(o,bar)});
              cell.appendChild(bar);
            });
          adRow.appendChild(cell);
        });
        if(weekSpans.length){
          adRow.style.position="relative";
          var layer=el('<div class="dl-week-span-layer"></div>');
          weekSpans.forEach(function(o,i){
            var allPositions=days.map(function(d,k){return coversDay(o,d)?k:-1}).filter(function(k){return k>=0});
            if(!allPositions.length)return;
            dayRuns(allPositions).forEach(function(positions){
            var cal=calOf(o.ev.cal),bar=el('<button class="dl-continuous-bar" style="background:'+tintOf(cal,o.ev)+';color:'+tintTextOf(cal,o.ev)+';box-shadow:'+ribbonOf(cal,o.ev)+'">'+esc(o.ev.title)+'</button>');
            var key=String(o.ev.id)+':'+(+o.start);
            bar.dataset.spanKey=key;bar.setAttribute("aria-label",o.ev.title);
            bar.style.left='calc((100% - var(--tg-gutter)) * '+positions[0]+'/'+numDays+' + var(--tg-gutter))';
            bar.style.width='calc((100% - var(--tg-gutter)) * '+(positions[positions.length-1]-positions[0]+1)+'/'+numDays+' - 3px)';
            bar.style.top=(3+i*27)+'px';
            bar.addEventListener("mouseenter",function(){viewWrap.querySelectorAll('[data-span-key="'+key+'"]').forEach(function(n){n.classList.add("dl-span-active")})});
            bar.addEventListener("mouseleave",function(){viewWrap.querySelectorAll('[data-span-key="'+key+'"]').forEach(function(n){n.classList.remove("dl-span-active")})});
            bar.addEventListener("click",function(e){
  e.stopPropagation();openPopover(o,bar);
  if(popEl&&popEl._occId===o.ev.id){
    viewWrap.querySelectorAll('[data-span-key="'+key+'"]').forEach(function(n){n.classList.add('dl-span-selected')});
  }
});
            layer.appendChild(bar);
            });
          });
          adRow.appendChild(layer);
        }
        wrap.appendChild(adRow);
        /* Even when Day view has no events, render the complete timeline,
           all-day area and current-time indicator. Empty slots remain clickable.
           Week view retains its existing empty-state treatment. */
        if (occs.length === 0 && numDays !== 1) {
          wrap.appendChild(buildEmptyState({
            icon: "calendar",
            title: "No events",
            sub: "Nothing is scheduled this week.",
            btnLabel: "New event",
            onBtn: function () { openEventForm(null, state.selected); }
          }));
          return wrap;
        }
        var scroll = el('<div class="tg-scroll"></div>');
        var body = el('<div class="tg-body" style="grid-template-columns:' + gridCols + ";height:" + 24 * hourPx() + 'px"></div>');
        var gutter = el('<div class="tg-gutter"></div>');
        for (var hr = 0; hr < 24; hr++) {
          var lab = el('<span class="hour-label' + (hr === 0 ? " is-first" : "") + '" style="top:' + hr * hourPx() + 'px">' + fmtHourLabel(hr) + "</span>");
          gutter.appendChild(lab);
        }
        body.appendChild(gutter);
        var now = new Date();
        var nowMin = now.getHours() * 60 + now.getMinutes();
        var todayInRange = days.some(function (d) { return sameDay(d, TODAY); });
        days.forEach(function (date) {
          var isWeekendCol = numDays > 1 && (date.getDay() === 0 || date.getDay() === 6);
          var colEl = el('<div class="tg-col' + (isWeekendCol ? " weekend" : "") + '"><div class="hour-lines" style="background-size:100% ' + hourPx() + 'px"></div></div>');
          var dayOccs = occs.filter(function (o) { return !o.ev.allDay && (numDays===1||!isMultiDay(o)) && sameDay(o.start, date); });
          layoutDayEvents(dayOccs).forEach(function (it) {
            var o = it.o, cal = calOf(o.ev.cal);
            var top = it.s / 60 * hourPx(), height = Math.max(26, (it.e - it.s) / 60 * hourPx() - 3);
            var leftPct = it.col / it.cols * 100, widthPct = 100 / it.cols;
            var card = el('<button class="ev-card" style="top:' + top + "px;height:" + height + "px;left:calc(" + leftPct + "% + 3px);width:calc(" + widthPct + "% - 6px);background:" + tintOf(cal,o.ev) + ";color:" + tintTextOf(cal,o.ev) + ";box-shadow:" + ribbonOf(cal,o.ev) + '">' +
              '<span class="ev-head"><span class="ev-title">' + esc(o.ev.title) + "</span>" +
              (height >= 44 ? '<span class="ev-time" style="display:block">' + fmtTimeRange(o.start, o.end) + "</span>" : "") + "</span>" +
              (o.loc && height >= 66 ? '<span class="ev-loc" style="display:block">' + esc(o.loc) + "</span>" : "") +
              "</button>");
            card.setAttribute("data-calendar-id",o.ev.cal);
            if (height < 58) card.querySelector(".ev-title").style.webkitLineClamp = "1";
            card.addEventListener("click", function (e) { openPopover(o, card); e.stopPropagation(); });
            colEl.appendChild(card);
          });
          colEl.addEventListener("click",function(e){
            if(e.target.closest("button"))return;
            var box=colEl.getBoundingClientRect();
            var minute=Math.max(0,Math.min(1410,Math.floor((e.clientY-box.top)/hourPx()*2)*30));
            var chosen=new Date(date);chosen.slotMinutes=minute;openEventForm(null,chosen);
          });
          body.appendChild(colEl);
        });
        if (todayInRange) {
          var line = el('<div class="now-line" style="top:' + nowMin / 60 * hourPx() + 'px;left:var(--tg-gutter)"></div>');
          body.appendChild(line);
          var nowTxt = fmtEventTime(now);
          var gutPill = el('<span class="now-pill" style="top:' + nowMin / 60 * hourPx() + 'px">' + nowTxt + "</span>");
          body.appendChild(gutPill);
        }
        scroll.appendChild(body);
        wrap.appendChild(scroll);
        /* A time line that is only partly visible (cut by the scroll edge) is hidden entirely: fully shown, or not at all. */
        /* "Whole" means both: not cut by the scroll edge, and not cut by the block's width (a narrow column would show a stray
           "…" or the tail of the range), so a time line is shown fully or not at all. */
        var timeFits = function (t) { return t.scrollWidth <= t.clientWidth + 1; };
        var timeSeen = new WeakMap();
        var timePaint = function (t) { t.style.visibility = (timeSeen.get(t) !== false && timeFits(t)) ? "" : "hidden"; };
        if (window.IntersectionObserver) {
          var timeWatch = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { timeSeen.set(en.target, en.intersectionRatio >= 0.999); timePaint(en.target); });
          }, { root: scroll, threshold: [0, 0.999, 1] });
          body.querySelectorAll(".ev-time").forEach(function (t) { timeWatch.observe(t); });
        }
        requestAnimationFrame(function () { body.querySelectorAll(".ev-time").forEach(timePaint); });
        return wrap;
      }

      function renderAgenda() {
        var start = sod(state.cursor), end = addDays(start, 21);
        var occs = occsInRange(start, end);
        var byDay = {};
        occs.forEach(function (o) {
          var first = sod(o.start);
          if (o.ev.weekdaysOnly) { while (first <= sod(o.end) && !coversDay(o, first)) first = addDays(first, 1); if (first > sod(o.end)) return; }
          var key = first.getTime();
          (byDay[key] = byDay[key] || []).push(o);
        });
        var scroll = el('<div class="agenda-scroll"></div>');
        var inner = el('<div class="agenda-inner"></div>');
        var keys = Object.keys(byDay).sort(function (a, b) { return a - b; });
        if (!keys.length) {
          inner.appendChild(buildEmptyState({
            icon: "calendar",
            title: "No events coming up",
            sub: "Nothing is scheduled in the next three weeks.",
            btnLabel: "New event",
            onBtn: function () { openEventForm(null, state.selected); }
          }));
        }
        keys.forEach(function (k) {
          var date = new Date(+k);
          var head = el('<div class="agenda-day-head"><span class="ad-name">' + DOWS[date.getDay()] + '</span><span class="ad-date">' + fmtDateShort(date) + "</span>" + (sameDay(date, TODAY) ? '<span class="ad-today">Today</span>' : "") + "</div>");
          inner.appendChild(head);
          byDay[k].slice().sort(function (a, b) { return (a.ev.allDay ? 0 : 1) - (b.ev.allDay ? 0 : 1) || a.start - b.start; }).forEach(function (o) {
            var cal = calOf(o.ev.cal);
            var meta = o.ev.allDay
              ? (isMultiDay(o) ? fmtDateShort(o.start) + " - " + fmtDateShort(sod(o.end)) : "All day")
              : fmtTimeRange(o.start, o.end);
            var card = el('<button class="agenda-card">' +
              '<span class="ac-dot" style="background:' + dotOf(cal) + '"></span>' +
              '<span class="agenda-details"><span class="ac-title">' + esc(o.ev.title) + '</span><span class="ac-meta" style="display:flex"><span class="agenda-cal-name">' + esc(cal.name) + '</span>' + icon("clock", 13) + "<span>" + esc(meta) + "</span></span>" +
              (o.ev.loc ? '<span class="agenda-location">' + icon("pin",13) + '<span>'+esc(o.ev.loc)+'</span></span>' : '') +
              "</span></button>");
            card.addEventListener("click", function (e) { openPopover(o, card); e.stopPropagation(); });
            inner.appendChild(card);
          });
        });
        if (keys.length) inner.appendChild(el('<div class="agenda-end">No more events in ' + MONTHS[addDays(start, 20).getMonth()] + '</div>'));
        scroll.appendChild(inner);
        var w = el('<div style="display:flex;flex-direction:column;flex:1;min-height:0"></div>');
        w.appendChild(scroll);
        return w;
      }

      /* ================= Tasks =================
         A first-class section that swaps into the main area in
         place of the calendar (the sidebar never moves). Tasks are
         plain in-memory records like events: { id, title, cal,
         due (Date), hasTime, done }. The add form's draft survives
         re-renders via taskDraft, so toggling a checkbox never eats
         a half-typed title. */
      var taskDraft = { title: "", date: null, cal: null };
      function taskDueLabel(t) {
        var rel = fmtRelativeDay(t.due);
        var base = rel || fmtDateShort(t.due);
        if (!rel && !sameDay(t.due, TODAY)) base = DOWS[t.due.getDay()] + " · " + base;
        if (t.hasTime) base += " · " + fmtTime(t.due);
        return base;
      }
      function refreshTasks(focusInput) {
        renderView(false);
        if (focusInput) {
          var i = document.getElementById("taskTitleInput");
          if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) {} }
        }
      }
      function renderTasks() {
        if (!taskDraft.date) taskDraft.date = sod(TODAY);
        if (!taskDraft.cal) taskDraft.cal = defaultCalId();
        var wrap = el('<div class="tasks-wrap"></div>');
        var inner = el('<div class="tasks-inner"></div>');
        wrap.appendChild(inner);
        var activeCount = state.tasks.filter(function (t) { return !t.done; }).length;
        var doneCount = state.tasks.length - activeCount;
        var head = el('<div class="tasks-head"><div><div class="tasks-title">Tasks</div><div class="tasks-sub">' +
          (state.tasks.length ? activeCount + " active · " + doneCount + " completed" : "Nothing here yet") +
          '</div></div></div>');
        var headAdd = el('<button class="btn-primary">' + icon("plus", 16) + "<span>Add task</span></button>");
        headAdd.addEventListener("click", function () { var i = document.getElementById("taskTitleInput"); if (i) { i.focus(); i.scrollIntoView({ block: "nearest" }); } });
        head.appendChild(headAdd);
        inner.appendChild(head);
        /* Add form — one card: title input, due-date picker (the
           calendar's own date popover), calendar picker (the app's
           menu), and the Add button. Enter in the title also adds. */
        var addCard = el('<div class="task-add-card"></div>');
        var titleIn = el('<input class="text-input" id="taskTitleInput" type="text" placeholder="Add a task…" aria-label="Task title" autocomplete="off">');
        titleIn.value = taskDraft.title;
        titleIn.addEventListener("input", function () { taskDraft.title = titleIn.value; titleIn.classList.remove("err"); });
        titleIn.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addTaskFromDraft(); } });
        addCard.appendChild(titleIn);
        var dueBtn = el('<button class="picker-btn" id="taskDueBtn" title="Due date" aria-label="Due date">' + icon("calendar", 15) + "<span></span></button>");
        function paintDueBtn() { dueBtn.querySelector("span").textContent = taskDueLabel({ due: taskDraft.date, hasTime: false }); }
        paintDueBtn();
        dueBtn.addEventListener("click", function () {
          openDatePicker(dueBtn, taskDraft.date, function (d) { taskDraft.date = sod(d); paintDueBtn(); titleIn.focus(); });
        });
        addCard.appendChild(dueBtn);
        var calBtn = el('<button class="picker-btn" id="taskCalBtn" title="Calendar" aria-label="Calendar"><span></span><span style="margin-left:2px;color:var(--muted)">' + icon("chevD", 14) + "</span></button>");
        function paintCalBtn() {
          var c = calOf(taskDraft.cal);
          calBtn.querySelector("span").innerHTML = '<span style="display:inline-flex;align-items:center;gap:7px"><span class="pop-dot" style="background:' + dotOf(c) + ';margin:0"></span>' + esc(c.name) + "</span>";
        }
        paintCalBtn();
        calBtn.addEventListener("click", function () {
          var items = [{ label2: "Calendar" }];
          writableCalendars().forEach(function (c) {
            items.push({ label: c.name, right: taskDraft.cal === c.id ? "check" : null, fn: function () { taskDraft.cal = c.id; paintCalBtn(); } });
          });
          openMenu(calBtn, items);
        });
        addCard.appendChild(calBtn);
        var addBtn = el('<button class="btn-primary"><span>Add</span></button>');
        addBtn.addEventListener("click", addTaskFromDraft);
        addCard.appendChild(addBtn);
        inner.appendChild(addCard);
        function addTaskFromDraft() {
          var title = (taskDraft.title || "").trim();
          if (!title) { titleIn.classList.add("err"); titleIn.focus(); return; }
          state.tasks.push(mkTask(title, taskDraft.cal || defaultCalId(), sod(taskDraft.date), false, false));
          taskDraft.title = "";
          toast("Task added");
          refreshTasks(true);
          renderSidebar();
        }
        /* Segmented filter */
        var seg = el('<div class="task-seg" role="tablist" aria-label="Filter tasks"></div>');
        [["all", "All"], ["active", "Active"], ["completed", "Completed"]].forEach(function (f) {
          var b = el('<button role="tab" aria-selected="' + (state.taskFilter === f[0]) + '" class="' + (state.taskFilter === f[0] ? "on" : "") + '">' + f[1] + "</button>");
          b.addEventListener("click", function () {
            if (state.taskFilter === f[0]) return;
            state.taskFilter = f[0];
            seg.querySelectorAll("button").forEach(function (x) { var on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-selected", String(on)); });
            var host = inner.querySelector(".task-results");
            if (!host) { refreshTasks(false); return; }
            var token = (host._swap = (host._swap || 0) + 1);
            function swap() {
              if (host._swap !== token || !host.isConnected) return;
              host.innerHTML = ""; fillResults(host);
              host.classList.remove("is-out");
              if (!state.reduceMotion && !reduceMotionMQ.matches) { host.classList.add("is-in"); setTimeout(function () { host.classList.remove("is-in"); }, 230); }
            }
            /* cross-fade: the old list fades out (110ms), the new one fades in (200ms); reduced motion swaps instantly */
            if (state.reduceMotion || reduceMotionMQ.matches) { swap(); return; }
            host.classList.remove("is-in"); host.classList.add("is-out");
            setTimeout(swap, 110);
          });
          seg.appendChild(b);
        });
        inner.appendChild(seg);
        /* Groups — Overdue / Today / Upcoming / Completed, empty
           groups hidden, each sorted by due date. They live in their own container so a tab switch cross-fades ONLY the list
           (and the empty state), never the add card or the tabs. */
        var resultsHost = el('<div class="task-results"></div>');
        inner.appendChild(resultsHost);
        function fillResults(host) {
          var today0 = sod(TODAY);
          var act = state.tasks.filter(function (t) { return !t.done; });
          var byDue = function (a, b) { return a.due - b.due; };
          var groups = [];
          if (state.taskFilter !== "completed") {
            groups.push({ name: "Overdue", cls: "overdue", list: act.filter(function (t) { return sod(t.due) < today0; }).sort(byDue) });
            groups.push({ name: "Today", cls: "", list: act.filter(function (t) { return sameDay(t.due, today0); }).sort(byDue) });
            groups.push({ name: "Upcoming", cls: "", list: act.filter(function (t) { return sod(t.due) > today0; }).sort(byDue) });
          }
          if (state.taskFilter !== "active") {
            groups.push({ name: "Completed", cls: "", list: state.tasks.filter(function (t) { return t.done; }).sort(function (a, b) { return b.due - a.due; }) });
          }
          var shown = 0;
          groups.forEach(function (g) {
            if (!g.list.length) return;
            shown += g.list.length;
            host.appendChild(el('<div class="task-group-title ' + g.cls + '">' + g.name + '<span class="tg-count">' + g.list.length + "</span></div>"));
            g.list.forEach(function (t) { host.appendChild(taskRow(t)); });
          });
          if (!shown) {
            if (!state.tasks.length) {
              host.appendChild(buildEmptyState({
                icon: "checkSq", title: "No tasks yet",
                sub: "Add your first task above — homework, swim gear, anything you need to remember.",
                hint: false
              }));
            } else if (state.taskFilter === "active") {
              host.appendChild(buildEmptyState({ icon: "checkSq", title: "Nothing active", sub: "Everything is done. Nice work.", hint: false }));
            } else if (state.taskFilter === "completed") {
              host.appendChild(buildEmptyState({ icon: "checkSq", title: "Nothing completed yet", sub: "Tick a task's checkbox and it will land here.", hint: false }));
            } else {
              host.appendChild(buildEmptyState({ icon: "checkSq", title: "No tasks", sub: "Add one above to get started.", hint: false }));
            }
          }
        }
        fillResults(resultsHost);
        return wrap;
      }
      function taskRow(t) {
        var cal = calOf(t.cal);
        var row = el('<div class="task-row' + (t.done ? " done" : "") + '"></div>');
        var overdue = !t.done && sod(t.due) < sod(TODAY);
        var chk = el('<button class="task-check' + (t.done ? " done" : "") + '" style="border-color:' + dotOf(cal) + '" title="' + (t.done ? "Mark not done" : "Mark done") + '" aria-label="' + (t.done ? "Mark not done: " : "Mark done: ") + esc(t.title) + '" aria-pressed="' + t.done + '">' + icon("check", 13) + "</button>");
        var chkBusy = false;
        chk.addEventListener("click", function () {
          if (chkBusy) return;
          /* Reduced motion: no sequence — the state flips at once. */
          if (state.reduceMotion || reduceMotionMQ.matches) {
            t.done = !t.done;
            refreshTasks(false);
            renderSidebar();
            return;
          }
          chkBusy = true;
          if (!t.done) {
            /* Complete, as a sequence: the green fill and a small
               pop land first, the white check draws itself in, and
               only then does the task settle — strikethrough title,
               Completed group, updated counts. */
            chk.classList.add("completing");
            chk.setAttribute("aria-pressed", "true");
            chk.title = "Mark not done";
            setTimeout(function () {
              t.done = true;
              refreshTasks(false);
              renderSidebar();
              /* The change lands after the animation, so queue the cloud save here (the click-time check saw no change yet). */
              if (window.daylightCloud && window.daylightCloud.save) window.daylightCloud.save();
            }, 300);
          } else {
            /* Un-complete runs it in reverse: the check undraws and
               the green clears, then the task returns to its group. */
            chk.classList.remove("done");
            chk.classList.add("uncompleting");
            chk.setAttribute("aria-pressed", "false");
            chk.title = "Mark done";
            setTimeout(function () {
              t.done = false;
              refreshTasks(false);
              renderSidebar();
              if (window.daylightCloud && window.daylightCloud.save) window.daylightCloud.save();
            }, 200);
          }
        });
        row.appendChild(chk);
        var main = el('<div class="task-main"><div class="task-title">' + esc(t.title) + '</div></div>');
        var meta = el('<div class="task-meta"></div>');
        var due = el('<button class="tm-due' + (overdue ? " overdue" : "") + '" title="Change due date" aria-label="Change due date for ' + esc(t.title) + '">' + icon("clock", 12) + "<span>" + esc(taskDueLabel(t)) + "</span></button>");
        due.addEventListener("click", function () {
          openDatePicker(due, t.due, function (d) {
            t.due = t.hasTime ? new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.due.getHours(), t.due.getMinutes()) : sod(d);
            refreshTasks(false);
          });
        });
        meta.appendChild(due);
        meta.appendChild(el('<span class="tm-cal"><span class="tm-dot" style="background:' + dotOf(cal) + '"></span>' + esc(cal.name) + "</span>"));
        main.appendChild(meta);
        row.appendChild(main);
        var acts = el('<div class="task-actions"></div>');
        var editBtn = el('<button class="icon-btn" title="Edit task" aria-label="Edit task: ' + esc(t.title) + '">' + icon("pencil", 15) + "</button>");
        editBtn.addEventListener("click", function () { startTaskEdit(row, t); });
        var delBtn = el('<button class="icon-btn" title="Delete task" aria-label="Delete task: ' + esc(t.title) + '">' + icon("trash", 15) + "</button>");
        delBtn.addEventListener("click", function () {
          openConfirm({
            title: "Delete this task?",
            body: "“" + t.title + "” will be removed. This cannot be undone.",
            confirmLabel: "Delete", danger: true,
            fn: function () {
              state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; });
              toast("Task deleted");
              refreshTasks(false);
              renderSidebar();
            }
          });
        });
        acts.appendChild(editBtn); acts.appendChild(delBtn);
        row.appendChild(acts);
        return row;
      }
      function startTaskEdit(row, t) {
        var main = row.querySelector(".task-main");
        if (!main || main.querySelector(".task-edit-input")) return;
        var titleEl = main.querySelector(".task-title");
        var input = el('<input class="task-edit-input" value="' + esc(t.title) + '" aria-label="Task title">');
        titleEl.replaceWith(input);
        input.focus(); input.select();
        /* Same one-shot guard as the calendar rename: Enter saves,
           the re-render removes the input, and the trailing blur
           must not save (or announce) a second time. */
        var finished = false;
        function done(save) {
          if (finished) return;
          finished = true;
          if (save && input.value.trim()) t.title = input.value.trim();
          refreshTasks(false);
        }
        input.addEventListener("blur", function () { done(true); });

         eliminating an unnecessary login render and flash during reload. */
      /* Keep "today" honest while the app sits open: re-derive it
         once a minute and whenever the app returns to the
         foreground, re-rendering only if the day actually rolled
         over (or an effective-zone change moved it). */
      setInterval(function () { if (!document.getElementById("app").hidden && refreshToday()) renderAll(false); }, 60000);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !document.getElementById("app").hidden && refreshToday()) renderAll(false);
      });
    </script>
