<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found · Daylight</title>
<script>
/* GitHub Pages serves this file for every unknown path, at any depth, so asset and link paths are built from the site's base:
   /<repo>/ on a github.io project site, / on a domain of its own. */
(function () {
  var seg = location.pathname.split("/").filter(Boolean)[0] || "";
  var base = (/\.github\.io$/.test(location.hostname) || seg === "daylight") && seg ? "/" + seg + "/" : "/";
  window.__DL_BASE = base;
  /* The AI-access consent step (/oauth/consent) is a route of the app: hand it, with its parameters, to the app page. */
  if (/\/oauth\/consent\/?$/.test(location.pathname)) {
    var id = new URLSearchParams(location.search).get("authorization_id") || "";
    location.replace(base + "dashboard/?oauth_consent=1" + (id ? "&authorization_id=" + encodeURIComponent(id) : ""));
    return;
  }
  /* Any other address under /dashboard (a typo, an old link, /dashboard/admin/users) goes to the nearest real page of the app, never to this page. */
  var dm = location.pathname.match(/\/dashboard\/(.+)$/);
  if (dm) {
    var first = dm[1].split("/")[0];
    location.replace(base + "dashboard/" + (/^(tasks|support|admin)$/.test(first) ? first + "/" : "") + location.search + location.hash);
    return;
  }
  var light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
  document.write('<link rel="icon" type="image/png" sizes="32x32" href="' + base + 'assets/favicon-' + (light ? "light" : "dark") + '-32.png">');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--surface:#282828;--text:#e0e0e0;--muted:#a0a0a0;--faint:#757575;--line:#2c2c2c;--btn-bg:#e0e0e0;--btn-text:#121212;--btn-hover:#ffffff}
[data-theme="light"]{--bg:#ffffff;--surface:#f5f5f5;--text:#171717;--muted:#737373;--faint:#a3a3a3;--line:#e5e5e5;--btn-bg:#171717;--btn-text:#ffffff;--btn-hover:#2e2e2e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top{display:flex;align-items:center;padding:22px 28px}
.brand{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none}
.brand img{width:34px;height:34px}
.brand span{font-size:16px;font-weight:800;letter-spacing:-.02em}
main{flex:1;display:grid;place-items:center;padding:24px 24px 96px}
.card{width:100%;max-width:560px;text-align:center}
.mark{width:72px;height:72px;display:block;margin:0 auto 28px}
.mark-dark{display:none}[data-theme="dark"] .mark-light{display:none}[data-theme="dark"] .mark-dark{display:block}
.code{display:inline-block;margin:0 0 20px;padding:5px 14px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
h1{text-wrap:balance;margin:0 0 14px;font-size:clamp(34px,6vw,48px);line-height:1.08;letter-spacing:-.03em;font-weight:600}
p{margin:0 auto 36px;max-width:26em;font-size:17px;line-height:1.6;color:var(--muted)}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 28px;border-radius:999px;font-size:15px;font-weight:600;text-decoration:none;transition:transform 160ms ease-out,background-color 160ms ease-out,color 160ms ease-out}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn-solid{background:var(--btn-bg);color:var(--btn-text)}.btn-solid:hover{background:var(--btn-hover)}
a:focus-visible{outline:2px solid var(--text);outline-offset:3px}
@media (max-width:480px){.top{padding:18px 20px}.mark{width:60px;height:60px}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header class="top"><a class="brand" id="brand" href="/"><img id="bL" alt="" width="34" height="34"><img id="bD" alt="" width="34" height="34" hidden><span>Daylight</span></a></header>
<main>
  <div class="card">
    <img class="mark mark-light" id="mL" alt="" width="72" height="72">
    <img class="mark mark-dark" id="mD" alt="" width="72" height="72">
    <span class="code">404</span>
    <h1>This page doesn’t exist.</h1>
    <p>The link may be old, or the address may have a typo.</p>
    <div class="actions"><a class="btn btn-solid" id="home" href="/">Back to Daylight</a></div>
  </div>
</main>
<script>
(function () {
  var b = window.__DL_BASE || "/", dark = document.documentElement.getAttribute("data-theme") === "dark";
  var light = b + "assets/daylight-sunarc-light-NOBG.png", darkSrc = b + "assets/daylight-sunarc-dark-NOBG.png";
  document.getElementById("mL").src = light; document.getElementById("mD").src = darkSrc;
  var bl = document.getElementById("bL"), bd = document.getElementById("bD");
  bl.src = light; bd.src = darkSrc; bl.hidden = dark; bd.hidden = !dark;
  document.getElementById("home").href = b; document.getElementById("brand").href = b;
})();
</script>
</body>
</html>
